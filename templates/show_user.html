<!DOCTYPE html>
<html>
  <body>
    <h1>Reseptikokoelma</h1>

    <h2>{{ user.username }}</h2>
    <p><a href="/">Etusivu</a></p>

    <h2>Käyttäjän reseptit</h2>

    {% if recipes %}
      {% for recipe in recipes %}
        <div>
          <h3>{{ recipe.title }}</h3>

        <a href="/recipe/{{ recipe.id }}">Avaa</a>
        </div>
        <hr>
      {% endfor %}
    {% else %}
      <p>Käyttäjä ei ole vielä luonut reseptejä.</p>
    {% endif %}

  </body>
</html>
